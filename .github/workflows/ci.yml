name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Run test suite
        run: uv run pytest -q

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Ruff
        run: uv run ruff check src tests scripts

  web-workspace:
    name: Research web build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install backend dependencies
        run: uv sync --extra dev --extra web
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/web
      - name: Build web frontend
        run: npm run build
        working-directory: frontend/web
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend/web
      - name: Browser integration tests
        run: npm run test:e2e
        working-directory: frontend/web

      - name: Build distributable wheel
        run: uv build --wheel
      - name: Verify wheel in a clean environment
        run: |
          uv venv /tmp/openharness-wheel-check
          for research_wheel in dist/*.whl; do
            uv pip install --python /tmp/openharness-wheel-check/bin/python "${research_wheel}[web]"
          done
          /tmp/openharness-wheel-check/bin/python tests/test_install/wheel_smoke.py
