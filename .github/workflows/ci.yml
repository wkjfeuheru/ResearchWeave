name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra web --extra eval

      - name: Set up sandbox Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          npm ci --prefix tools/sandbox
          echo "$GITHUB_WORKSPACE/tools/sandbox/node_modules/.bin" >> "$GITHUB_PATH"
          docker build --pull --no-cache -t openharness-sandbox:latest src/openharness/sandbox
      - name: Run test suite
        run: uv run --frozen pytest -q

  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra web --extra eval

      - name: Strict production types
        run: uv run --frozen python scripts/check_types.py
      - name: Ruff
        run: uv run --frozen ruff check src tests scripts evals hatch_build.py
      - name: Production formatting
        run: uv run --frozen ruff format --check src evals scripts/check_types.py hatch_build.py

  web-workspace:
    name: Research web build and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install backend dependencies
        run: uv sync --frozen --extra dev --extra web --extra eval
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/web
      - name: Build web frontend
        run: npm run build
        working-directory: frontend/web
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend/web
      - name: Set up sandbox Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          npm ci --prefix tools/sandbox
          echo "$GITHUB_WORKSPACE/tools/sandbox/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Browser integration tests
        run: npm run test:e2e
        working-directory: frontend/web

      - name: Build distributable wheel
        run: uv build --wheel
      - name: Verify wheel in a clean environment
        run: |
          uv venv /tmp/openharness-wheel-check
          uv export --frozen --no-dev --extra web --no-emit-project --no-hashes --format requirements-txt -o /tmp/openharness-wheel-constraints.txt
          for research_wheel in dist/*.whl; do
            uv pip install --python /tmp/openharness-wheel-check/bin/python --constraint /tmp/openharness-wheel-constraints.txt "${research_wheel}[web]"
          done
          /tmp/openharness-wheel-check/bin/python tests/test_install/wheel_smoke.py

  sandbox-acceptance:
    name: Real sandbox acceptance (missing backends fail)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install mandatory backends
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          npm ci --prefix tools/sandbox
          echo "$GITHUB_WORKSPACE/tools/sandbox/node_modules/.bin" >> "$GITHUB_PATH"
          uv sync --frozen --extra dev --extra web --extra eval
          docker build --pull --no-cache -t openharness-sandbox:latest src/openharness/sandbox
          docker tag openharness-sandbox:latest openharness-sandbox-e2e:latest
      - name: Real isolation and crash recovery
        env:
          OPENHARNESS_REQUIRE_SANDBOX: "1"
        run: uv run --frozen pytest -q tests/test_research/test_report_sandbox.py tests/test_research/test_dispatch_recovery.py scripts/test_docker_sandbox_e2e.py
